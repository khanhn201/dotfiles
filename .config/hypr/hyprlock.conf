# Wallpaper-derived M3 scheme, shared with Hyprland and Quickshell.
# Generated by scripts/m3-from-wallpaper.py -- do not edit colors.conf by hand.
source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

# GENERAL
general {
    disable_loading_bar = true
    ignore_empty_input = true
    fail_timeout = 0
}

animations {
  enabled = false
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/wallpapers/wallpaper2.png
    blur_passes = 0
    color = $surface
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $onSurface
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $onSurface
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary
    inner_color = $surfaceContainerHigh
    font_color = $onSurface
    fade_on_empty = false
    placeholder_text = <span foreground="##$onSurfaceHex"><i>󰌾 Logged in as </i><span foreground="##$primaryHex">$USER</span></span>
    hide_input = false
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    position = 0, -100
    halign = center
    valign = center
}
